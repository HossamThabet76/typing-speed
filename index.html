<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Typing Speed</title>
</head>
<body>
    <div class="game">
        <h2 class="title">Typing Speed Test Game</h2>
        <div class="content">
            <div class="buttons">
                <button class="lvl">Easy</button>
                <button class="lvl">Normal</button>
                <button class="lvl">Hard</button>
            </div>
            <div class="txt">You Are Playing On <span class="level">....</span> Level & You Have <span class="sec">....</span> Seconds To Type The Word</div>
            <button class="playing">Start Playing</button>
            <h1 class="word"></h1>
            <input type="text">
            <div class="words">Words Will Show Here</div>
            <div class="result">
                <div class="time">Time Left: <span class="timeCount">....</span> Seconds</div>
                <div class="score">Score: <span class="scoreCurrent">....</span> From <span class="numWords">....</span></div>
            </div>
            <div class="finish"></div>
            <button class="again">Play Again</button>
            <div class="count">3</div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
